server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # single-page app: every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets can be cached long; index.html never (so a redeploy shows immediately).
    # `expires` instead of add_header, so the security headers above are still inherited.
    location /assets/ {
        expires 7d;
    }
    location = /index.html {
        expires -1;
    }
}
