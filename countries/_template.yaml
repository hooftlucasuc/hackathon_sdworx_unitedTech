# countries/_template.yaml — copy to countries/<CODE>.yaml and fill every value.
# All keys are required; startup fails loudly on a missing key. Values are free.
# Files starting with "_" are ignored by the loader.

code:                             # ISO-3166 alpha-2, e.g. DE. Must match the folder sources/<CODE>/
name:                             # human name, e.g. Germany
languages: []                     # accepted languages of sources and questions, e.g. [de, en]
currency:                         # e.g. EUR
date_format:                      # e.g. "DD.MM.YYYY" — display only

# Authority of a source type. Higher = more authoritative. Keys are the allowed values of
# `source_type` in sidecar metadata for this country. `expert_answer` must exist: the
# self-healing loop writes items of that type.
source_hierarchy:
  law: 5
  collective_agreement: 4
  policy: 3
  procedure: 2
  expert_answer: 2
  email: 1
  teams: 1

# Freshness decay in days: full score until full_score_days, zero at zero_score_days, linear between.
freshness:
  full_score_days: 180
  zero_score_days: 730

# Governance
require_owner: true               # ownerless items score 0 on ownership when true
escalation_threshold: 60          # trust_score below this → escalate=true
expert_tags: []                   # vocabulary for routing experts, e.g. [payroll_de, urlaubsgeld]

# Free-text notes shown to Claude as context (legacy rules, terminology, known pitfalls)
context_notes: |
