# Cloud Build: build backend/ image, push to Artifact Registry, deploy to Cloud Run (europe-west1).
# Used by the GitHub trigger (see docs/backend.md). Manual run from the repo root:
#   gcloud builds submit --region=europe-west1 --config=infra/cloudbuild.backend.yaml \
#     --service-account=projects/$GCP_PROJECT/serviceAccounts/callsight-deployer@$GCP_PROJECT.iam.gserviceaccount.com .
substitutions:
  _REGION: europe-west1
  _SERVICE: callsight-backend
  _AR_REPO: callsight
  _RUNTIME_SA: callsight-backend
  _FRONTEND_ORIGIN: http://localhost:5173
  _DEMO_MODE: "true"
  # local: embeddings run in the container (no Vertex). Needed where org policy blocks Vertex Gen AI.
  # Switch to vertex + gemini-embedding-001 + dim 768 where Vertex is allowed.
  _EMBEDDING_PROVIDER: local
  _EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  _EMBEDDING_DIM: "384"
  _ESCALATION_THRESHOLD: "80"
  _MEMORY: 2Gi
  _CPU: "2"
  # 1 = no cold start (the model takes ~15 s to load); 0 = cheaper, first call after idle is slow
  _MIN_INSTANCES: "0"

options:
  logging: CLOUD_LOGGING_ONLY
  # 8 vCPU instead of the default 2: pip and the image push are the slow parts
  machineType: E2_HIGHCPU_8

steps:
  # BuildKit with inline cache: layers of the previous :latest are reused, so a code-only change
  # skips pip and the model download (backend/Dockerfile keeps those layers first).
  - id: build
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --build-arg
      - EMBEDDING_PROVIDER=${_EMBEDDING_PROVIDER}
      - --build-arg
      - EMBEDDING_MODEL=${_EMBEDDING_MODEL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - backend

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com
      # public without an allUsers IAM binding (allowed under domain-restricted-sharing org policies);
      # the webhook still authenticates every request with its HMAC signature
      - --no-invoker-iam-check
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=3
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --timeout=120
      - --set-env-vars=^@^GCP_PROJECT=$PROJECT_ID@GCP_REGION=${_REGION}@FRONTEND_ORIGIN=${_FRONTEND_ORIGIN}@DEMO_MODE=${_DEMO_MODE}@EMBEDDING_PROVIDER=${_EMBEDDING_PROVIDER}@EMBEDDING_MODEL=${_EMBEDDING_MODEL}@EMBEDDING_DIM=${_EMBEDDING_DIM}@ESCALATION_THRESHOLD=${_ESCALATION_THRESHOLD}
      - --set-secrets=ELEVENLABS_WEBHOOK_SECRET=elevenlabs-webhook-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
