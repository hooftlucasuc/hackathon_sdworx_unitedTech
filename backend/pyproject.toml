[project]
name = "callsight-backend"
version = "0.1.0"
description = "CallSight backend: ElevenLabs post-call webhook -> Firestore -> scored solutions for the SD Worx dashboard."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "google-auth>=2.29",
  "google-cloud-firestore>=2.19",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
# EMBEDDING_PROVIDER=local: run embeddings in-process, no Vertex. Pulls torch (~large).
local = ["sentence-transformers>=2.7,<6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends/Body/Path defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
