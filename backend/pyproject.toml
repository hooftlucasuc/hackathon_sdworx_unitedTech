[project]
name = "trustcard-backend"
version = "0.1.0"
description = "TrustCard: every answer comes with an explainable trust score; every doubt becomes knowledge."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  "google-cloud-aiplatform>=1.60",
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007"]  # keep Optional[...] for the 3.9 runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
